<style>
  /* ==========   主题变量   ========== */
  :root {
    --bg: #f5fdff;				/* 页面底色 */

    --text: #1b1c1e;			/* 主文字色 */

    --border: #e5e5e2;			/* 边框、分隔线 */

    --radius: 14px;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #3a424d;
    --surface: #0f1113;
    --text: #e9ecef;
    --muted: #9298a0;
    --border: #26292e;
    --accent: #7ab4c2;
    --accent-soft: #445359;
    --header-bg: rgba(20, 23, 24, 0.95);
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  /* ==========   板块主题色   ========== */

  body[data-section="astronomy"] {
    --accent: #1d4e89;
    --accent-soft: #e6eef8;
  }

    --accent: #79b0ea;
    --accent-soft: #16263a;
  }

  /* 交通：深绿 */

    --accent: #1f6b45;
    --accent-soft: #e6f2ea;
  }
  [data-theme="dark"] body[data-section="transport"] {

    --accent-soft: #16281e;
  }

  /* 文博：棕黄 */
  body[data-section="museum"] {
    --accent: #96651c;
    --accent-soft: #f7efe0;
  }
  [data-theme="dark"] body[data-section="museum"] {
    --accent: #e2b96a;
    --accent-soft: #2b2317;
  }

  /* ==========   基础样式   ========== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;

  .header-inner {

    align-items: center;

    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; flex: none; }
  .logo-box {

    padding: 20px;
    background: var(--surface);

  .card-head h2 a:hover { color: var(--accent); }

  .article-list { margin: 14px 0 16px; }
  .article-list li + li { border-top: 1px dashed var(--border); }
  .article-list a {

    align-items: baseline;
    gap: 12px;

  .article-list a:hover .t { color: var(--accent); }

  .crumbs a:hover { text-decoration: underline; }

  .page-head h1 { margin: 0 0 6px; font-size: clamp(24px, 3.4vw, 30px); }
  .page-head p { margin: 0; color: var(--muted); font-size: 14.5px; }

  .article-rows { margin-top: 22px; display: flex; flex-direction: column; gap: 2px; }
  .article-row a {
    display: block;
    padding: 16px;
    border: 1px solid transparent;

  .article-row a:hover h3 { color: var(--accent); }
  .article-row p { margin: 0 0 6px; font-size: 14px; color: var(--muted); }
  .article-row time { font-size: 12px; color: var(--muted); }

  /* ===================== 文章页 ===================== */
  .article h1 { margin: 0 0 8px; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.35; }
  .article .meta { margin: 0 0 20px; font-size: 13px; color: var(--muted); }
  .article .summary {

    border-left: 3px solid var(--accent);

    color: var(--muted);

  /* ===== 文章页两栏布局 + 右侧粘性目录 ===== */
  .article-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 230px;
    gap: 32px;
    align-items: start;

  .article-main { min-width: 0; }

  .article-aside {
    position: sticky;
    top: 84px;
    max-height: calc(100vh - 104px);

    padding-bottom: 8px;

  .article-toc {

    border: 1px solid var(--border);

  .article-toc h3 { margin: 0 0 10px; font-size: 14px; color: var(--text); }
  .article-toc ol { margin: 0; padding-left: 1.2em; line-height: 1.9; }
  .article-toc a { cursor: pointer; color: var(--muted); }

  /* 资源列表：标题即链接，介绍另起一行 */
  .article-body .res-list li a { font-weight: 600; }

  /* ===================== 关于我们 ===================== */
  .about h1 { margin: 0 0 22px; font-size: clamp(24px, 3.4vw, 32px); }

    .article-body h2 { font-size: 19px; }
    .article-body h3 { font-size: 16.5px; }
    .footer-inner { flex-direction: column; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<h2 id="astro-intro">写在前面</h2>
<p>只要是在天气晴朗的夜晚，室外的遮挡不是很高，我们就能轻易地看到天上的点点星辰，或许熹微，或许璀璨。许多人对天文的一点喜爱就是由此而生。网络上，有些人看到壮阔的星云、绚烂的流星，可能也会对天文心生热忱。</p>
<p>“从哪里能看到中国空间站过境的资料呢？”</p>
<p>“对一个天文小白而言，应该从哪里学习初步的理论知识？”</p>
<p>“想给同学推荐一些天文科普书，有没有什么推荐的？”</p>
<p>“有哪些虚拟软件可以看星星？”</p>
<p>过去，如果想深入学习某一方面的知识，除了前辈的言传身教和为数不多的真假科普书以外，再无途径。幸运的是，网络为所有愿意接触知识、广泛涉猎的人敞开了大门。在互联网上，不仅有各式各样的课程、书籍，还有浩如烟海的网站、纪录片、软件等等各种多媒体，等待着有心人去发现、去探索、去传播。</p>
<p>目前，国外有很多不同爱好者或是官方学者搜集整理的各领域线上资料，比如天文及相关领域，就有以下汇总可供参考：</p>
<ul class="res-list">
  <li> <span class="tag">E</span> <b>University of Washington Libraries</b> <a href="https://guides.lib.uw.edu/c.php?g=341353&p=2303542" target="_blank" rel="noopener">guides.lib.uw.edu</a> </li>
  <li> <span class="tag">E</span><span class="tag tag-v">V</span> <b>WIKIPEDIA – List of astronomy websites</b> <a href="https://en.wikipedia.org/wiki/List_of_astronomy_websites" target="_blank" rel="noopener">en.wikipedia.org</a> </li>
  <li> <span class="tag">E</span> <b>Astro Web – Astronomy on the Internet</b> <a href="http://cdsweb.u-strasbg.fr/astroWeb/astroweb.html" target="_blank" rel="noopener">cdsweb.u-strasbg.fr</a> </li>
  <li> …… </li>
</ul>
<p>然而，国内相关的汇总虽然存在，但难免有所缺漏、覆盖不全、针对性不强。本文档试图收集整理国内外有用的、有趣的线上线下资源，为国内外对天文学有兴趣的人铺下一条小路，种下一颗树苗。如果能够给一部分爱好者带去那么一点点便利，笔者也就感到开心了。</p>
<p>笔者并非天文学相关从业者，并非天文专业学生，甚至也不算是一个合格的爱好者，不过是一个爱看星星的普通人罢了，因此整理时必定出现了大大小小的谬误和瑕疵，敬请多加批评、指点、增补。<br><br></p>
<p><b>清辉应万里，不独照长安。</b><br><br></p>
<p style="text-align: right;">By 长勤，2022 年深秋</p>

<h2 id="astro-tag">标识注释</h2>
<p>为了适应国内天文科普事业发展现状、更好服务天文爱好者尤其是入门爱好者，笔者在整理时，主要遵从了以中文网站和资源为主、外文网站和资源为辅、多渠道资源互补且择优收录的原则。由于国内部分领域的天文科普尚存在一定短板，因此，部分外文网站和资源成了主要知识来源，笔者在收录时标识如下：</p>
<p> <span class="tag">D</span> 德文网站或资源，或以德语为主的网站或资源</p>
<p> <span class="tag">E</span> 英文网站或资源，或以英语为主的网站或资源</p>
<p> <span class="tag">F</span> 法文网站或资源，或以法语为主的网站或资源</p>
<p> <span class="tag">J</span> 日文网站或资源，或以日语为主的网站或资源</p>

<h3>1.1 天文相关知识入门</h3>
<p>很多网站既可用于观测辅助，也可用于理论学习。以下分类可能较为主观，建议先做了解，自行运用。</p>

  <li><b>Windy</b> <a href="https://www.windy.com/" target="_blank" rel="noopener">windy.com</a> —— 天气预测与展望利器，提供 GFS、ECMWF、ICON 等模型，可查云量、降水、风况、温度，户外地图对查询路线也有帮助。</li>

<h3>2.2 气象条件</h3>
<p>气象预报对长期天气、局地天气的预报仍多有不足。若想准确判断未来一段时间的天气，需结合云图、天气形势图等综合判断，综合各种模型，不能仅依靠一家之言。</p>
<ul class="res-list">
  <li><b>天文通</b>（手机 APP） <a href="https://laysky.com/download.html" target="_blank" rel="noopener">laysky.com/download</a> —— 比较方便的观星情况查询渠道，更推荐同名微信小程序。</li>
  <li><b>中国气象</b>（手机 APP） —— 查看气象实况、未来两小时降雨情况，提供部分历史数据查询。</li>
  <li><b>知天气</b>（手机 APP） —— 查看气象实况和监测数据等，部分功能需专业版。</li>
  <li><b>莉景天气</b>（手机 APP） <a href="http://ljtw.antforecast.com/" target="_blank" rel="noopener">ljtw.antforecast.com</a> —— 一大功能是朝霞、晚霞、彩虹等预报，部分功能需付费。</li>
  <li><b>新宏气象</b>（手机 APP） —— 可用于航空气象数据监测，也可查看探空图，数据不一定完整。</li>
  <li><b>看天</b>（手机 APP） <a href="https://www.pgyer.com/1Bf7" target="_blank" rel="noopener">pgyer.com/1Bf7</a> —— 较新、广受推荐的 APP，侧重灾害监测和数据分析。</li>
</ul>

<ul class="res-list">
  <li><b>Adobe Photoshop / Lightroom</b> <a href="https://www.adobe.com/" target="_blank" rel="noopener">adobe.com</a> —— Ps 一般处理单张照片，Lr 一般用于批量处理图片。</li>
  <li><b>Astra Image 3</b> <a href="https://www.autostakker.com/" target="_blank" rel="noopener">autostakker.com</a> —— 图像处理、锐化、增强和分析软件。</li>
  <li><b>AutoStakkert!3（AS!3）</b> <a href="https://www.autostakkert.com/" target="_blank" rel="noopener">autostakkert.com</a> —— 视频叠加处理软件，主要用于月球、太阳、系内行星表面细节的后期处理。</li>
  <li><b>MaxIm DL 5/24</b> —— 又被称作万金油，可用于相机等设备控制和天文图像后期处理。</li>

  <li><b>PixInsight</b> <a href="https://www.pixinsight.com/" target="_blank" rel="noopener">pixinsight.com</a> —— 天文摄影中的图像处理软件。</li>

<p>本部分内容只是以笔者个人的视角做出的分类与推荐，不能完整代表所有天文相关书目。在初步了解后，相信读者能根据自身喜好，找到更多适合自身的书籍。</p>

<h2 id="t9-intro">写在前面</h2>
<p>如果要求每个人都乘火车从甲地前往乙地，我想，只要条件允许，多数人会选择用时最短、距离最近、停站最少的那趟车。显然，从中卫到银川，乘坐高铁只需要一个小时出头，可谓最佳选择。抛开绕行到陕西定边的 7532 次列车，7512 次列车是包兰线上这一区间最慢的一趟列车了。不过，相比高铁线路，包兰线蜿蜒在贺兰山下，好处在于可以慢慢欣赏风景，何况我和这趟车还有别样的“渊源”。[reference:4]</p>
<p>7512 次列车行经甘肃省、宁夏回族自治区，多数站点都在宁夏境内，全程近 600 公里。本次列车由长庆桥站始发，经中卫站调向后转入包兰线行驶至银川站，后一段也是我本次所搭乘的路段。现在是 2025 年 4 月 4 日，今日列车本务机车为一台 SS7E 机车。[reference:5]</p>

<h2 id="t9-body">中卫站与上车</h2>
<p>按照最开始的计划，我打算在中卫市区游览一下，并在傍晚乘车去首府银川。然而现实是，我没能赶上前序其他列车，导致改签后到达中卫已经是下午四点多了，时间很紧，我只能马不停蹄搭车前往火车站，还好这段路程没有再另生事端。[reference:6]</p>
<p>这是我第一次看到中卫站的完整模样。十余年前，我曾乘火车路过中卫，但印象也仅限于此；一年多前，我再次乘车路过中卫，当时已是后半夜，我记得我在卧铺上听到了列车进站刹车、乘务开门迎客的声音，但很快就又睡了过去。今天站在中卫站面前，我感到颇为熟悉，有种回到了多年前的感觉。换句话说，中卫站有点老、有些破旧。中卫站的站前广场倒是很宽阔，叫卖的、闲逛的、后车的，占据了广场一侧的多半位置。下午的阳光暖洋洋的，如果不是要乘车，我也很想在这里多坐一会儿。[reference:7]</p>
<p>进站，检票，上车。考虑到这趟车要在中卫停留十几分钟，我放好背包又走下车厢。通过水牌可以看出，这趟车会在银川—7511/4—长庆桥—K9663—兰州—K9664—长庆桥—7513/2—银川之间往返，而一年前，我乘坐的恰好就是 K9664 次。虽然车次不一样，车厢和乘务人员可能也和当时的不同，但对我而言，在这趟旅途中，似乎又见到了一位老朋友。我往卧铺方向踱了几步，但终究没有过去，因为我知道，软卧车厢应该是没有开放的，今天我也注定无法再登上那节车厢。随着乘务人员的催促，我们几个还在车下逗留的旅客也就赶紧上了车。[reference:8]</p>

<h2 id="t9-view">沿途风景</h2>
<p>列车缓缓驶出车站向东出发，我就坐在窗边，静静地看着风景。或许是没有什么其他的特点，连绵不绝的输电塔给了我很深的印象。沙坡头—杞乡—贺兰山—沙湖的 750kV 线路沿贺兰山铺设，一路伴随着我们；有些电塔好像刚竖立不久，太阳一照便闪闪发光，令人炫目。据统计，宁夏 2025 年累计外送电量突破 1000 亿千瓦时，这也应当算是国内特有的工业浪漫了。[reference:9]</p>
<p>虽然在 12306 网站上看，7512 次列车在中卫到银川之间没有多少站点，但实际上，它在柳家庄、黄羊湾、新市沟、枣园堡等站都会停靠，就像一趟大型公交车一样。列车停停走走，但并没有多少人上下车，车厢显得空荡荡的；窗外的群山也显得光秃秃的，显露出西北地区黄土地的本色，倒是偶尔路过一两片农田时，可以看到几抹绿色。我当天已经没有其他安排了，何况我的座位在无障碍车厢里，空间很大，我也就乐于随着这趟满火车一起缓缓前行，这里坐坐，那里看看。[reference:10]</p>

<p><b>（以上为节选，完整内容可在公众号原文阅读。）</b></p>
<p style="text-align: right;">By 一立方厘米微光</p>

const TRANS_K7835 = `
<h2 id="t10-intro">写在前面</h2>
<p>要想细致盘点全国各省的文物资源，山西一定会让人眼前大放异彩；要想进一步探索古建筑，那就更不得不提到山西了。根据公布的全国重点文物保护单位名录，山西的“国保”数量高居首位，且绝大多数都是古建筑。这些古建筑星星点点地散落在三晋大地上，很多都远离城市，不耗费一番精力是很难前往拜访的，随着游戏《黑神话：悟空》而火起来的小西天亦是如此。[reference:11]</p>
<p>我在山西游历得不少，但有几次都是自驾，坐火车则主要途经南同蒲线或者大西高铁往返太原，细想起来，居然几乎没有从太原站再乘车继续向北的经历。同时，受交通因素影响，我也没有在山西去过太偏僻的景点。趁着周末空闲，朋友提议搞一次短途旅行，我突然想到了小西天这个地方，和朋友一拍即合，由此，我们也恰好体验一下刚开通没多久的瓦日铁路客运。今天是 2024 年 12 月 8 日，列车本务机车为 HXD3C 1055，来自太局太段。[reference:12]</p>

<h2 id="t10-wari">瓦日线与这趟车</h2>
<p>瓦日线虽然在客运中没什么名气，但在货运中还是占据极为重要的地位的。它是我国中长期铁路网规划的重要组成部分，是西煤东运、北煤南运、进口铁矿石西运的主要通道，是继大秦铁路之后我国一次建成、里程最长、技术标准最高的万吨重载大能力运输通道，从山西吕梁的瓦塘站到山东日照的日照南站，线路全长近 1300km，于 2014 年底正式通车。本次开通客运的区间全程在山西省内，不过列车运行的速度并不快，如果搭乘全程，运行时间还是很长的，这可能也是它从太原发车很早的原因，为此，我们不得不规划一个早点到太原站的方案。为了节约一些时间和资金成本，我们最终选择当晚乘坐 K238 次列车直达太原站，然后直接换乘 K7835 次列车。[reference:13]</p>

<h2 id="t10-board">上车与初印象</h2>
<p>早晨 6 点出头，随着 K238 早点到站，我们也松了一口气。这次的换乘时间只有二十多分钟，出站吃饭是来不及了，还好车站的便利店已经开门。我们也没时间在车站吃，买完之后就抓紧赶到候车室检票上站台。看得出来，为了同时做好文旅宣传，这趟车做了充分的装饰。车厢一侧画出了这趟车的行驶路线，展示了沿线各地的红色纪念馆；“红色故里 大美山西”的标语占据了外面小半个车厢的位置，看起来还算协调；走进车内，同样能感受到一股红色韵味。放好行李，列车很快就准点出发了。[reference:14]</p>
<p>可能是发车时间太早，我们这节车厢只有几十个乘客零散地坐着，旁边的车厢甚至几乎是空的。望向东侧，道路街区灯光点点，天空也已经不再是漆黑一片，但整座城市仍然显得安静，显得我们脚下车轮与轨道碰撞的声音格外刺耳。考虑到一早也没有其他事情做，趁着早饭还热着，我们抓紧时间解决了温饱问题。此时，列车也已靠近太原西山，准备向吕梁山脉深处行驶。一抹朝霞从东边山头晕染开来，汾河在山脚下铁轨旁蜿蜒，远处的太原第二电厂透过晨光显现出轮廓。进入太兴线后，前方相当长的路段都是隧道，趁着人少，恰是找个座位体验一下“硬座代硬卧”的时候。何况，从太原站出发后的将近三个小时内，K7835 次列车不再停靠其他站点，跨越 200 公里的距离，驶过太兴线直达临县，因此，我自己在这一段路上休息得很好。[reference:15]</p>

/* --- 文章页（支持 content 正文或占位块） --- */
function renderArticle(key, id) {
  const sec = DATA[key];
  const art = sec.articles.find(a => a.id === id);
  if (!art) return renderNotFound();

  const meta = [art.date, sec.title, art.author]
    .filter(Boolean).map(esc).join(' · ');

  const crumbs = `
    <nav class="crumbs">
      <a href="#/home">首页</a> /
      <a href="#/${key}">${esc(sec.title)}</a> /
      <span>${esc(art.title)}</span>
    </nav>`;

  // 无正文：保持原占位结构
  if (!art.content) {
    return `${crumbs}
      <article class="article">
        <h1>${esc(art.title)}</h1>
        <p class="meta">${meta}</p>
        <p class="summary">${esc(art.summary)}</p>
        <div class="placeholder">
          <p class="big">📄 文章正文区域（预留）</p>
          <p>此处将放置正文内容、配图与注释，目前暂未添加。</p>
        </div>
      </article>`;
  }

  // 有正文：左栏正文 + 右栏目录
  return `${crumbs}
    <div class="article-layout">
      <article class="article article-main">
        <h1>${esc(art.title)}</h1>
        <p class="meta">${meta}</p>
        <p class="summary">${esc(art.summary)}</p>
        <div class="article-body">${art.content}</div>
      </article>
      <aside class="article-aside"></aside>
    </div>`;
}

/* 渲染后处理：目录移到右侧，资源列表改为“标题即链接、介绍换行” */
function afterRenderArticle() {
  const body  = document.querySelector('.article-body');
  const aside = document.querySelector('.article-aside');
  if (!body || !aside) return;

  // ① 目录移到右侧
  const toc = body.querySelector('.toc');
  if (toc) {
    toc.classList.remove('toc');
    toc.classList.add('article-toc');
    aside.appendChild(toc);
  } else {
    aside.style.display = 'none';
  }

  // ② 资源列表：标题融合超链接，介绍另起一行
  enhanceArticleLinks(body);
}

function enhanceArticleLinks(root) {
  root.querySelectorAll('ul.res-list li').forEach(li => {
    // 把 <b>标题</b> <a>网址</a> 改成 <a href="网址"><b>标题</b></a>
    li.querySelectorAll('b').forEach(b => {
      if (b.closest('a')) return;
      const a = b.nextElementSibling;
      if (!a || a.tagName !== 'A') return;

      const newA = document.createElement('a');
      newA.href = a.getAttribute('href');
      if (a.target) newA.target = a.target;
      if (a.rel)    newA.rel    = a.rel;
      newA.appendChild(b.cloneNode(true));

      b.replaceWith(newA);
      a.remove();
    });

    // 把 “—— 介绍” 改成 “<br>介绍”
    const walker = document.createTreeWalker(li, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const txt = node.nodeValue;
      const idx = txt.indexOf('——');
      if (idx === -1) continue;

      const before = txt.slice(0, idx).replace(/\s+$/, '');
      const after  = txt.slice(idx + 2).replace(/^\s+/, '');

      const frag = document.createDocumentFragment();
      if (before.trim()) frag.appendChild(document.createTextNode(before + ' '));
      frag.appendChild(document.createElement('br'));
      if (after) frag.appendChild(document.createTextNode(after));

      node.parentNode.replaceChild(frag, node);
      break;
    }
  });
}

/* =========================================================
   四、路由
   ========================================================= */
function getRoute() {
  const raw = location.hash.replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  return { key: parts[0] || 'home', id: parts[1] || '' };
}

function setActiveNav(key) {
  navEl.querySelectorAll('a').forEach(a => {
    a.classList.toggle('active', a.dataset.key === key);
  });
}

function router() {
  const { key, id } = getRoute();
  let html, title;

  if (key === 'home') {
    html = renderHome();
    title = '首页';
  } else if (key === 'about') {
    html = renderAbout();
    title = '关于我们';
  } else if (DATA[key]) {
    if (id) {
      html = renderArticle(key, id);
      const art = DATA[key].articles.find(a => a.id === id);
      title = art ? art.title : '文章';
    } else {
      html = renderSection(key);
      title = DATA[key].title;
    }
  } else {
    html = renderNotFound();
    title = '页面未找到';
  }

  app.innerHTML = html;

  // 根据当前板块切换主题色；非天文/交通/文博时清除标记
  document.body.dataset.section =
    (key === 'astronomy' || key === 'transport' || key === 'museum') ? key : '';

  // 文章页渲染后处理
  if (document.querySelector('.article-layout')) afterRenderArticle();

  setActiveNav(key === 'home' || key === 'about' || DATA[key] ? key : 'home');
  document.title = `${title} · 一立方厘米微光`;
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

    `<a href="#/${n.key}" data-key="${n.key}">${n.label}</a>`

/* ==========   日间夜间模式切换   ========== */
function applyTheme(theme) {
  rootEl.setAttribute('data-theme', theme);
  themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  themeBtn.setAttribute('aria-label', theme === 'dark' ? '切换到日间模式' : '切换到夜间模式');
  try { localStorage.setItem('site-theme', theme); } catch (e) {}
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('site-theme'); } catch (e) {}
  const prefersDark = window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'light'));
})();

themeBtn.addEventListener('click', () => {
  applyTheme(rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

renderNav();
router();

window.addEventListener('hashchange', router);
